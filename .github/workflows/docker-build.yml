name: Build & Push Patched OpenSearch Image

on:
  push:
    branches: [ fix/cve-libsolv-netty-3.7 ]
  workflow_dispatch:

env:
  ECR_REGISTRY: 728921286627.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: opensearchproject/opensearch
  AWS_REGION: us-east-1

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="3.7.0-${SHORT_SHA}"
          docker build \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:3.7.0-patched" \
            -t "${IMAGE}:latest" \
            -f Dockerfile .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:3.7.0-patched"
          docker push "${IMAGE}:latest"
          echo "Pushed: ${IMAGE}:${TAG}"
